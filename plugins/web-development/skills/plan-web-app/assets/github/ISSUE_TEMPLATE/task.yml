name: Task
description: Track an executable product or engineering task
title: ""
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the observable outcome this task should produce.
      placeholder: What should become true when this task is complete?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this work is needed and link relevant designs, decisions, or discussions.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the work included in this task and any important exclusions.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Define observable checks that prove the task is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and references
      description: Link blocking Issues, pull requests, specifications, or other evidence.
    validations:
      required: false
