<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-2: #f0f0ec;
  --text: #1c1d1f;
  --muted: #5b5f66;
  --line: #dcdcd6;
  --focus: #1d4ed8;
  --blocker: #b42318;
  --blocker-bg: #fde8e6;
  --major: #9a4b00;
  --major-bg: #fdf0dc;
  --minor: #3f4a5a;
  --minor-bg: #e9edf2;
  --suggestion: #1f4fb8;
  --suggestion-bg: #e5edfd;
  --ok: #26683a;
  --ok-bg: #e3f2e7;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141517;
    --surface: #1c1e21;
    --surface-2: #25282c;
    --text: #ececea;
    --muted: #a5a9b0;
    --line: #34383d;
    --focus: #8ab4ff;
    --blocker: #ffb4ab;
    --blocker-bg: #4a1c17;
    --major: #ffc98a;
    --major-bg: #47300f;
    --minor: #c5cfdc;
    --minor-bg: #2d3540;
    --suggestion: #a9c3ff;
    --suggestion-bg: #1e2f52;
    --ok: #9ad6a9;
    --ok-bg: #1c3a25;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--suggestion); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; padding: 8px 12px; background: var(--surface); }
.skip:focus { left: 16px; top: 16px; z-index: 10; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 40px 24px 80px; }
header.page h1 { font-size: clamp(1.75rem, 3vw + 1rem, 2.5rem); line-height: 1.15; margin: 0 0 12px; letter-spacing: -0.01em; }
.meta { color: var(--muted); margin: 0; display: flex; flex-wrap: wrap; gap: 4px 20px; }
.verdict { font-size: 1.15rem; max-width: 70ch; margin: 24px 0 0; }
section { margin-top: 56px; }
h2 { font-size: 1.35rem; margin: 0 0 16px; }
h3 { font-size: 1.1rem; margin: 0; line-height: 1.35; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 32px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.stat b { display: block; font-size: 1.75rem; line-height: 1.1; }
.stat span { color: var(--muted); font-size: 0.9rem; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px;
  font-size: 0.8rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.chip.blocker { background: var(--blocker-bg); color: var(--blocker); }
.chip.major { background: var(--major-bg); color: var(--major); }
.chip.minor { background: var(--minor-bg); color: var(--minor); }
.chip.suggestion { background: var(--suggestion-bg); color: var(--suggestion); }
.chip.signature { background: var(--ok-bg); color: var(--ok); }
.lede { color: var(--muted); margin: -8px 0 16px; max-width: 72ch; }
figure { margin: 0; }
.finding .body.has-compare { grid-template-columns: minmax(0, 1fr); }
.compare { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; }
.themes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.theme { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.theme p { margin: 8px 0 0; }
.theme .refs { color: var(--muted); font-size: 0.9rem; }
.strengths li { margin-top: 6px; }
.part { margin-top: 72px; }
.area-nav ul { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 20px; }
.area-nav .note { display: inline; }
.part > h2 { font-size: 1.6rem; }
.area-group { margin-top: 36px; }
.area-title { font-size: 1.25rem; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.area-title .note { display: inline; margin-left: 8px; font-size: 0.9rem; }
.sev-title { margin: 20px 0 0; font-size: 1rem; display: flex; align-items: center; gap: 8px; color: var(--muted); }
.ideas .finding { border-left: 4px solid var(--suggestion); }
.ideas .finding[data-severity="signature"] { border-left-color: var(--ok); }
figcaption { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
.priorities { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.priorities li { display: grid; grid-template-columns: 2.25rem 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.priorities .rank { font-size: 1.4rem; font-weight: 700; color: var(--muted); line-height: 1.2; }
.priorities p { margin: 6px 0 0; }
.filters { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.filters fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filters legend { float: left; margin-right: 6px; color: var(--muted); font-size: 0.85rem; }
.filters button {
  font: inherit; font-size: 0.85rem; padding: 4px 12px; min-height: 32px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
}
.filters button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; background: transparent; }
.filters input { font: inherit; font-size: 0.9rem; padding: 6px 10px; min-height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); min-width: 220px; }
.count { color: var(--muted); font-size: 0.9rem; margin: 12px 0 0; }
.finding { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-top: 16px; scroll-margin-top: 80px; }
.finding header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.finding .fid { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
.finding .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.finding .body { display: grid; gap: 20px; margin-top: 16px; }
@media (min-width: 860px) { .finding .body.has-media { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } }
.media { display: grid; gap: 8px; align-content: start; }
.zoom { padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); cursor: zoom-in; display: block; width: 100%; }
.zoom img { display: block; width: 100%; height: auto; border-radius: 7px; }
dl { margin: 0; display: grid; gap: 10px; align-content: start; }
dt { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
dd { margin: 2px 0 0; max-width: 72ch; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 0.92rem; }
.table-scroll { overflow-x: auto; border-radius: var(--radius); }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.8rem; color: var(--muted); font-weight: 700; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
.st { white-space: nowrap; font-weight: 600; }
.st.checked { color: var(--ok); }
.st.unverifiable, .st.pending { color: var(--major); }
.st.not-applicable { color: var(--muted); }
.note { display: block; font-weight: 400; color: var(--muted); white-space: normal; font-size: 0.85rem; }
.prose { max-width: 72ch; }
.prose ul { padding-left: 1.2rem; }
footer.page { margin-top: 64px; color: var(--muted); font-size: 0.9rem; max-width: 72ch; }
dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
dialog::backdrop { background: rgba(0, 0, 0, 0.75); }
dialog img { display: block; max-width: 96vw; max-height: 88vh; height: auto; border-radius: 8px; background: #fff; }
dialog form { text-align: right; margin-bottom: 8px; }
dialog button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 0; cursor: pointer; }
@media (max-width: 600px) { .wrap { padding: 24px 16px 64px; } .finding { padding: 16px; } .filters input { min-width: 0; width: 100%; } }
@media print { .filters, .skip { display: none; } .finding { break-inside: avoid; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<a class="skip" href="#findings">Skip to findings</a>
<main class="wrap">
{{content}}
</main>
<dialog id="zoom-dialog" aria-label="Enlarged image">
  <form method="dialog"><button type="submit">Close</button></form>
  <img alt="">
</dialog>
<script>
(() => {
  const findings = [...document.querySelectorAll("#defect-list .finding")];
  const buttons = [...document.querySelectorAll(".filters button[data-filter]")];
  const search = document.querySelector(".filters input[type=search]");
  const count = document.getElementById("finding-count");
  const apply = () => {
    const active = {};
    for (const button of buttons) {
      const group = button.dataset.filter;
      active[group] ??= new Set();
      if (button.getAttribute("aria-pressed") === "true") active[group].add(button.dataset.value);
    }
    const query = (search?.value ?? "").trim().toLowerCase();
    let shown = 0;
    for (const finding of findings) {
      const visible =
        Object.entries(active).every(([group, values]) => values.has(finding.dataset[group])) &&
        (!query || finding.textContent.toLowerCase().includes(query));
      finding.hidden = !visible;
      if (visible) shown += 1;
    }
    for (const group of document.querySelectorAll("#defect-list .sev-group, #defect-list .area-group")) {
      group.hidden = ![...group.querySelectorAll(".finding")].some((finding) => !finding.hidden);
    }
    if (count) count.textContent = `Showing ${shown} of ${findings.length} problems`;
  };
  for (const button of buttons) {
    button.addEventListener("click", () => {
      button.setAttribute("aria-pressed", button.getAttribute("aria-pressed") === "true" ? "false" : "true");
      apply();
    });
  }
  search?.addEventListener("input", apply);
  const dialog = document.getElementById("zoom-dialog");
  const dialogImage = dialog.querySelector("img");
  for (const zoom of document.querySelectorAll(".zoom")) {
    zoom.addEventListener("click", () => {
      const image = zoom.querySelector("img");
      dialogImage.src = image.src;
      dialogImage.alt = image.alt;
      dialog.showModal();
    });
  }
  dialog.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); });
  apply();
})();
</script>
</body>
</html>
